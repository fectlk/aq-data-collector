name: Weekly report

on:
  schedule:
    - cron: "30 2 * * 1"   # Monday 08:00 Sri Lanka time
  workflow_dispatch:

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m fect_weather report
      - name: Commit report
        run: |
          git config user.name "fect-bot"
          git config user.email "fect-bot@users.noreply.github.com"
          git add reports
          git diff --cached --quiet || git commit -m "report: weekly AQI summary"
          git pull --rebase -X theirs
          git push
