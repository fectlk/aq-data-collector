name: Collect AQI data

on:
  schedule:
    - cron: "17 */3 * * *"   # every 3 hours (UTC), off the top of the hour
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Collect Open-Meteo data (3 tries)
        run: |
          for i in 1 2 3; do
            python -m fect_weather collect && exit 0
            echo "attempt $i failed"; sleep 60
          done
          exit 1
        continue-on-error: true
      - name: AQICN stations (optional, needs WAQI_TOKEN secret)
        run: python -m fect_weather waqi
        continue-on-error: true
        env:
          WAQI_TOKEN: ${{ secrets.WAQI_TOKEN }}
      - name: OpenWeather air pollution (optional, needs OPENWEATHER_API_KEY secret)
        run: python -m fect_weather openweather
        continue-on-error: true
        env:
          OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
      - name: IQAir stations (optional, needs IQAIR_API_KEY secret)
        run: python -m fect_weather iqair
        continue-on-error: true
        env:
          IQAIR_API_KEY: ${{ secrets.IQAIR_API_KEY }}
      - run: python -m fect_weather prune
      - run: python -m fect_weather map
      - name: Commit changes
        run: |
          git config user.name "fect-bot"
          git config user.email "fect-bot@users.noreply.github.com"
          git add data docs config
          git diff --cached --quiet || git commit -m "data: AQI update $(TZ=Asia/Colombo date +'%Y-%m-%d %H:%M') SLST"
          git pull --rebase -X theirs
          git push
